[package]
name = "muse-code-gui-windows"
version = "0.1.0"
description = "Muse Code GUI (Windows desktop shell)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
