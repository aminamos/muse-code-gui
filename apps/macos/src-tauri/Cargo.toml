[package]
name = "muse-code-ui-macos"
version = "0.1.0"
description = "Muse Code UI for macOS (Tauri v2 desktop shell)"
authors = ["Amin Amos"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
